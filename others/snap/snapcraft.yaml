name: just-keep-chasing
base: core22
version: '0.8.13'
summary: A wave-based 2D shooter with roguelite elements (in the future)
description: |
  Play as a nanobot fighting viruses, bacteria, and pathogens inside a human body.
  
  Features:
    - Wave-based combat with 30+ enemy types
    - 10+ weapons including shotguns, snipers, and rocket launchers
    - Power-ups: slow time, heal, screen blast, invincibility
    - Augment system for upgrading between waves
    - 30+ language localizations
    - 5-minute runs perfect for quick sessions
  
  Controls: WASD or arrow keys to move, Space to switch weapons,
  1-4 for power-ups, R to reload, E to pick up weapons.

grade: stable
confinement: strict

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  just-keep-chasing:
    command: just-keep-chasing
    extensions: [gnome]
    plugs: [home, network, removable-media, unity7]

parts:
  just-keep-chasing:
    plugin: dump
    source: ./builds/
    source-type: local
    stage-packages:
      - libglu1-mesa
      - libxcursor1
      - libxinerama1
      - libxrandr2
      - libxi6
      - libpulse0
    override-build: |
      craftctl default
      chmod +x $SNAPCRAFT_PART_INSTALL/just-keep-chasing

layout:
  /usr/share/just-keep-chasing:
    bind: $SNAP/usr/share/just-keep-chasing
